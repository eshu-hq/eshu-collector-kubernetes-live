# Collector CI: thin wrapper over the shared reusable lanes.
#
# Stable job names (same in every collector repo; only ci-complete is ever
# required in a ruleset): lint, test, race, shell, image, actionlint,
# govulncheck, gosec, ci-complete. The lint/test/race/shell/image/
# govulncheck/gosec lane bodies live in eshu-hq/.github go-collector-ci,
# pinned by SHA below; this file keeps path selection (changes), the
# coverage floor, the local actionlint lane (no reusable equivalent), and
# the top-level ci-complete aggregate, so the required check name never
# moves. Nested reusable checks surface as "go-ci / <lane>".
#
# Path selection happens once, in the changes job (dorny/paths-filter). A PR
# only pays for lanes its paths can affect. Pushes to main and manual
# dispatches run every PR lane (a workflow change must prove the lanes still
# work); the weekly schedule runs govulncheck and gosec (the run-* gates go
# false while changes is skipped, and those two reusable lanes are
# unconditional). The image lane is unconditional too, so the release image
# builds on every run, schedule included.
#
# Fixture classification (Eshu #9200 lesson: JSON under code paths is code):
# collector/testdata/8859-parity-kubernetes-live.json is read by
# collector/proof_parity_test.go and manifest_test.go; manifest.yaml is
# go:embed'ed by manifest_embed.go and read by manifest_test.go and
# release_version_test.go; grant.example.json is read by manifest_test.go;
# Dockerfile is read by dockerfile_test.go; .github/workflows/ci.yml is read
# by dockerfile_test.go (TestCIBuildsTheReleaseImage requires the reusable
# image lane with "run-image: true" below, or a direct "docker build" of
# "./Dockerfile") and release.yml by release_workflow_test.go.
# config.example.yaml has no test reader today but rides the explicit
# *.example.* fixtures entry. README.md is opened by readme_test.go, which
# asserts both pin lines (TestReadmePinsMatchGoMod) and seven prose phrases
# (TestReadmeProofClaimsNameThePodTemplateExclusion), so prose edits stay in
# the docs class per the epic table: a rewording reds main on the post-merge
# push, which runs every lane.
name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    # Weekly security sweep: govulncheck + gosec (plus the image build).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Minimum total statement coverage percent. Starts at the measured
  # baseline; may only rise as tests land. The finish line is 90, already
  # cleared: 1467/1605 statements (91.4%). Kept here for `make race`, which
  # reads this line, and passed to the reusable lanes as coverage-floor.
  COVERAGE_FLOOR: "91.4"

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
      image: ${{ steps.filter.outputs.image }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
            fixtures:
              - 'collector/testdata/**'
              - '**/*.json'
              - 'manifest.yaml'
              - 'config.example.yaml'
              - 'grant.example.json'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            docs:
              - 'README.md'
              - 'LICENSE'
              - 'CODEOWNERS'
              - '**/*.md'

  go-ci:
    needs: [changes]
    # Skipped only on docs-only PRs (no lane can be affected). On the weekly
    # schedule changes is skipped, so schedule is pinned true and the
    # reusable govulncheck/gosec lanes still run (fail closed). Each run-*
    # mirrors the lane condition the in-repo workflow used before the
    # reusable migration.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.image == 'true'
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@79dd01d7719645485e2e8e07e8075ccba8c518b5 # main with dead-pin fix (v1 tag predates it; move to v2 tag when eshu-hq/.github#9 lands)
    with:
      module: eshu-collector-kubernetes-live
      working-directory: .
      coverage-floor: 91.4
      # Must match the go directive in go.mod; bump together. (The reusable
      # default is older than this module's toolchain.)
      go-version: "1.26.10"
      run-image: true
      run-lint: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-test: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.image == 'true' }}
      run-race: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-shell: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.shell == 'true' }}

  actionlint:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  ci-complete:
    needs: [changes, go-ci, actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"] per job: comparing whole job OBJECTS to
          # "failure" never matches (false-green), and needs.*.result is a
          # bare ARRAY that kills green runs on AttributeError.
          # Never change this shape without a seeded red proof.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
